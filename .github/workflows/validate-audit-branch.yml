name: Validate audit branch

on:
  push:
    branches:
      - audit/fix-navigation-and-legal-links

concurrency:
  group: audit-branch-validation
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: audit/fix-navigation-and-legal-links
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Convert public PNG photos to WebP
        run: |
          sudo apt-get update
          sudo apt-get install -y webp
          find public -maxdepth 1 -type f -iname '*.png' ! -name 'design-reference.png' ! -name 'ehal-greka-header.png' -print0 | while IFS= read -r -d '' file; do
            output="${file%.png}.webp"
            if [ ! -f "$output" ]; then
              cwebp -quiet -q 82 -m 6 -resize 1800 1800 "$file" -o "$output"
            fi
          done
          find public -maxdepth 1 -type f -iname '*.webp' ! -name '*-mobile.webp' -print0 | while IFS= read -r -d '' file; do
            mobile="${file%.webp}-mobile.webp"
            if [ ! -f "$mobile" ]; then
              cwebp -quiet -q 76 -m 6 -resize 900 900 "$file" -o "$mobile"
            fi
          done
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          for (const file of ['src/App.tsx', 'src/styles.css', 'index.html']) {
            const source = fs.readFileSync(file, 'utf8');
            const updated = source.replace(/\.png/g, '.webp').replaceAll('ehal-greka-header.webp', 'ehal-greka-header.png');
            if (updated !== source) fs.writeFileSync(file, updated);
          }
          NODE
          mkdir -p source-images
          find public -maxdepth 1 -type f -iname '*.png' ! -name 'ehal-greka-header.png' -print0 | while IFS= read -r -d '' file; do
            mv "$file" source-images/
          done
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const sourceFiles = ['src/App.tsx', 'src/styles.css', 'index.html'];
          const used = new Set();
          for (const file of sourceFiles) {
            const source = fs.readFileSync(file, 'utf8');
            for (const match of source.matchAll(/\/raki\/([^"'\x60)]+\.webp)/g)) {
              used.add(decodeURIComponent(match[1]));
            }
          }
          for (const name of fs.readdirSync('public')) {
            if (name.endsWith('.webp') && !name.endsWith('-mobile.webp') && !used.has(name)) {
              fs.renameSync(path.join('public', name), path.join('source-images', name));
            }
          }
          NODE
      - name: Install dependencies
        run: npm ci
      - name: Audit local links, assets and checkout guards
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const app = fs.readFileSync('src/App.tsx', 'utf8');
          const css = fs.readFileSync('src/styles.css', 'utf8');
          const html = fs.readFileSync('index.html', 'utf8');
          const failures = [];
          const ids = [...app.matchAll(/\bid="([^"]+)"/g)].map(match => match[1]);
          const duplicates = ids.filter((id, index) => ids.indexOf(id) !== index);
          if (duplicates.length) failures.push('Duplicate JSX ids: ' + [...new Set(duplicates)].join(', '));
          const availableIds = new Set([...ids, ...[...html.matchAll(/\bid="([^"]+)"/g)].map(match => match[1])]);
          const anchors = [...app.matchAll(/href="#([^"]+)"/g)].map(match => match[1]);
          for (const anchor of [...new Set(anchors)]) {
            if (!availableIds.has(anchor)) failures.push('Missing in-page anchor: #' + anchor);
          }
          for (const file of ['public/privacy.html', 'public/terms.html']) {
            if (!fs.existsSync(file)) failures.push('Missing legal page: ' + file);
          }
          const assetSources = [app, css, html].join('\n');
          for (const match of assetSources.matchAll(/\/raki\/([^"'\x60)]+?\.(?:webp|png|jpg|jpeg|svg))/g)) {
            let name;
            try { name = decodeURIComponent(match[1]); } catch { name = match[1]; }
            if (!fs.existsSync(path.join('public', name))) failures.push('Missing public asset: ' + name);
          }
          if (!app.includes('phoneDigits.length<10||phoneDigits.length>15')) failures.push('Checkout phone digit validation is missing');
          if (!app.includes("if(!name){setOrderError('Укажите, пожалуйста, ваше имя.')")) failures.push('Checkout name validation is missing');
          if (!app.includes("localStorage.setItem('rak-cart'")) failures.push('Cart persistence is missing');
          if (!css.includes('color:#92988f;font-size:9px')) failures.push('Footer text contrast improvement is missing');
          if (failures.length) {
            console.error(failures.map(item => 'FAIL: ' + item).join('\n'));
            process.exit(1);
          }
          console.log('Audit smoke checks passed: anchors, legal pages, referenced assets, duplicate ids and checkout guards.');
          NODE
      - name: Dependency vulnerability report
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('/tmp/npm-audit.json', 'utf8'));
          console.log('Dependency audit summary:', JSON.stringify(report.metadata?.vulnerabilities ?? {}));
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            console.log(JSON.stringify({
              package: name,
              severity: item.severity,
              direct: item.isDirect,
              range: item.range,
              fixAvailable: item.fixAvailable
            }));
          }
          NODE
      - name: TypeScript and production build
        run: npm run build
      - name: Install browser test and Lighthouse tools
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0 lighthouse@12.8.2
          npx playwright install --with-deps chromium
      - name: Run browser regression tests
        run: npx playwright test
      - name: Run Lighthouse mobile and desktop audits
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/vite-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/raki/ > /dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:4173/raki/ > /dev/null
          CHROME_PATH="$(node -e "const { chromium } = require('playwright'); process.stdout.write(chromium.executablePath())")"
          npx lighthouse http://127.0.0.1:4173/raki/ --chrome-path="$CHROME_PATH" --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --output=json --output-path=/tmp/lighthouse-mobile.json --quiet
          npx lighthouse http://127.0.0.1:4173/raki/ --chrome-path="$CHROME_PATH" --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --preset=desktop --output=json --output-path=/tmp/lighthouse-desktop.json --quiet
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          for (const [device, file] of [['mobile', '/tmp/lighthouse-mobile.json'], ['desktop', '/tmp/lighthouse-desktop.json']]) {
            const report = JSON.parse(fs.readFileSync(file, 'utf8'));
            const score = name => Math.round((report.categories[name]?.score ?? 0) * 100);
            const audit = id => report.audits[id]?.numericValue ?? null;
            console.log(JSON.stringify({
              device,
              performance: score('performance'),
              accessibility: score('accessibility'),
              bestPractices: score('best-practices'),
              seo: score('seo'),
              lcpMs: audit('largest-contentful-paint'),
              cls: audit('cumulative-layout-shift'),
              tbtMs: audit('total-blocking-time'),
              speedIndexMs: audit('speed-index'),
              findings: Object.entries(report.audits)
                .filter(([id, item]) => item.score !== null && item.score < 0.9 && ['opportunity', 'table', 'list'].includes(item.details?.type))
                .sort((a, b) => (b[1].details?.overallSavingsMs ?? 0) - (a[1].details?.overallSavingsMs ?? 0))
                .slice(0, 10)
                .map(([id, item]) => ({
                  id,
                  title: item.title,
                  score: item.score,
                  displayValue: item.displayValue,
                  savingsMs: item.details?.overallSavingsMs ?? 0,
                  savingsBytes: item.details?.overallSavingsBytes ?? 0
                })),
              lcpElement: report.audits['largest-contentful-paint-element']?.details?.items?.[0]?.items?.[0]?.node?.snippet
                ?? report.audits['largest-contentful-paint-element']?.details?.items?.[0]?.node?.snippet
                ?? null,
              contrastIssues: (report.audits['color-contrast']?.details?.items ?? [])
                .slice(0, 12)
                .map(item => ({
                  selector: item.node?.selector,
                  snippet: item.node?.snippet,
                  explanation: item.node?.explanation
                }))
            }));
          }
          NODE
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: /tmp/lighthouse-*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Commit optimized images and references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public source-images src/App.tsx src/styles.css index.html package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Optimize site photos and archive PNG originals"
            git push origin HEAD:audit/fix-navigation-and-legal-links
          fi

name: Validate audit branch

on:
  push:
    branches:
      - audit/fix-navigation-and-legal-links

concurrency:
  group: audit-branch-validation
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: audit/fix-navigation-and-legal-links
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Convert public PNG photos to WebP
        run: |
          sudo apt-get update
          sudo apt-get install -y webp
          find public -maxdepth 1 -type f -iname '*.png' ! -name 'design-reference.png' ! -name 'ehal-greka-header.png' -print0 | while IFS= read -r -d '' file; do
            output="${file%.png}.webp"
            if [ ! -f "$output" ]; then
              cwebp -quiet -q 82 -m 6 -resize 1800 1800 "$file" -o "$output"
            fi
          done
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          for (const file of ['src/App.tsx', 'src/styles.css', 'index.html']) {
            const source = fs.readFileSync(file, 'utf8');
            const updated = source.replace(/\.png/g, '.webp').replaceAll('ehal-greka-header.webp', 'ehal-greka-header.png');
            if (updated !== source) fs.writeFileSync(file, updated);
          }
          NODE
          mkdir -p source-images
          find public -maxdepth 1 -type f -iname '*.png' ! -name 'ehal-greka-header.png' -print0 | while IFS= read -r -d '' file; do
            mv "$file" source-images/
          done
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const sourceFiles = ['src/App.tsx', 'src/styles.css', 'index.html'];
          const used = new Set();
          for (const file of sourceFiles) {
            const source = fs.readFileSync(file, 'utf8');
            for (const match of source.matchAll(/\/raki\/([^"'\x60)]+\.webp)/g)) {
              used.add(decodeURIComponent(match[1]));
            }
          }
          for (const name of fs.readdirSync('public')) {
            if (name.endsWith('.webp') && !used.has(name)) {
              fs.renameSync(path.join('public', name), path.join('source-images', name));
            }
          }
          NODE
      - name: Install dependencies
        run: npm ci
      - name: Audit local links, assets and checkout guards
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const app = fs.readFileSync('src/App.tsx', 'utf8');
          const css = fs.readFileSync('src/styles.css', 'utf8');
          const html = fs.readFileSync('index.html', 'utf8');
          const failures = [];
          const ids = [...app.matchAll(/\bid="([^"]+)"/g)].map(match => match[1]);
          const duplicates = ids.filter((id, index) => ids.indexOf(id) !== index);
          if (duplicates.length) failures.push('Duplicate JSX ids: ' + [...new Set(duplicates)].join(', '));
          const availableIds = new Set([...ids, ...[...html.matchAll(/\bid="([^"]+)"/g)].map(match => match[1])]);
          const anchors = [...app.matchAll(/href="#([^"]+)"/g)].map(match => match[1]);
          for (const anchor of [...new Set(anchors)]) {
            if (!availableIds.has(anchor)) failures.push('Missing in-page anchor: #' + anchor);
          }
          for (const file of ['public/privacy.html', 'public/terms.html']) {
            if (!fs.existsSync(file)) failures.push('Missing legal page: ' + file);
          }
          const assetSources = [app, css, html].join('\n');
          for (const match of assetSources.matchAll(/\/raki\/([^"'\x60)]+?\.(?:webp|png|jpg|jpeg|svg))/g)) {
            let name;
            try { name = decodeURIComponent(match[1]); } catch { name = match[1]; }
            if (!fs.existsSync(path.join('public', name))) failures.push('Missing public asset: ' + name);
          }
          if (!app.includes('phoneDigits.length<10||phoneDigits.length>15')) failures.push('Checkout phone digit validation is missing');
          if (!app.includes("if(!name){setOrderError('Укажите, пожалуйста, ваше имя.')")) failures.push('Checkout name validation is missing');
          if (!app.includes("localStorage.setItem('rak-cart'")) failures.push('Cart persistence is missing');
          if (failures.length) {
            console.error(failures.map(item => 'FAIL: ' + item).join('\n'));
            process.exit(1);
          }
          console.log('Audit smoke checks passed: anchors, legal pages, referenced assets, duplicate ids and checkout guards.');
          NODE
      - name: Dependency vulnerability report
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('/tmp/npm-audit.json', 'utf8'));
          console.log('Dependency audit summary:', JSON.stringify(report.metadata?.vulnerabilities ?? {}));
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            console.log(JSON.stringify({
              package: name,
              severity: item.severity,
              direct: item.isDirect,
              range: item.range,
              fixAvailable: item.fixAvailable
            }));
          }
          NODE
      - name: TypeScript and production build
        run: npm run build
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Run browser regression tests
        run: npx playwright test
      - name: Commit optimized images and references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public source-images src/App.tsx src/styles.css index.html package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Optimize site photos and archive PNG originals"
            git push origin HEAD:audit/fix-navigation-and-legal-links
          fi

name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Audit npm dependencies
        run: npm audit --audit-level=high
      - name: Verify Cloudflare Pages build
        run: npm run build:cloudflare
      - name: Compile Cloudflare Pages Functions
        run: npm run check:cloudflare-functions
      - name: Type-check Vercel order function
        run: npm run check:vercel-function
      - name: Build Vite site for GitHub Pages
        run: npm run build
      - name: Optimize public images to WebP
        run: |
          npm install --no-save --no-package-lock sharp@0.33.5
          node scripts/optimize-images.mjs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
